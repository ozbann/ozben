<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ozbenapp"><meta name="application-name" content="ozbenapp"><meta name="theme-color" content="#e11d48"><style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ozbenapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tek sütun mobil uygulama; büyük sayfa başlığı, degrade özet kartı, halka göstergeler, yüzen cam sekme çubuğu */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --sunk:#eceef3; --line:#e2e5ec;
  --fg:#11151c; --muted:#6b7280;
  --accent:#e11d48; --accent-2:#f97316; --accent-soft:#ffe4e9; --on-accent:#ffffff;
  --water:#0ea5e9; --water-soft:#e0f2fe;
  --good:#10b981; --good-soft:#d1fae5; --warn:#d97706; --bad:#e11d48;
  --hero-1:#e11d48; --hero-2:#9f1239; --hero-fg:#ffffff;
  --hero-3:#f97316; --hero-4:#c2410c; --violet:#7c3aed; --violet-soft:#ede9fe; --rest-1:#7c3aed; --rest-2:#4c1d95; --amber:#d97706; --amber-soft:#fef3c7; --blue:#0284c7; --blue-soft:#e0f2fe; --sch-1:#2563eb; --sch-2:#1e3a8a; --teal-1:#0f766e; --teal-2:#134e4a;
  --shadow:0 1px 2px rgba(17,21,28,.04),0 8px 24px -8px rgba(17,21,28,.10);
  --glass:rgba(255,255,255,.78);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0d12; --surface:#161a22; --sunk:#1e232d; --line:#262c38;
  --fg:#f1f3f7; --muted:#8b93a3;
  --accent:#fb4f73; --accent-2:#fb923c; --accent-soft:#3b1520; --on-accent:#ffffff;
  --water:#38bdf8; --water-soft:#0c2a3a;
  --good:#34d399; --good-soft:#0e2e24; --warn:#fbbf24; --bad:#fb4f73;
  --hero-1:#be123c; --hero-2:#4c0519; --hero-fg:#ffffff;
  --hero-3:#c2410c; --hero-4:#431407; --violet:#a78bfa; --violet-soft:#2a1f4a; --rest-1:#6d28d9; --rest-2:#2e1065; --amber:#fbbf24; --amber-soft:#3a2a0a; --blue:#38bdf8; --blue-soft:#0c2a3a; --sch-1:#1d4ed8; --sch-2:#172554; --teal-1:#0f766e; --teal-2:#042f2e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.6);
  --glass:rgba(22,26,34,.78); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#161a22; --sunk:#1e232d; --line:#262c38;
  --fg:#f1f3f7; --muted:#8b93a3;
  --accent:#fb4f73; --accent-2:#fb923c; --accent-soft:#3b1520; --on-accent:#ffffff;
  --water:#38bdf8; --water-soft:#0c2a3a;
  --good:#34d399; --good-soft:#0e2e24; --warn:#fbbf24; --bad:#fb4f73;
  --hero-1:#be123c; --hero-2:#4c0519; --hero-fg:#ffffff;
  --hero-3:#c2410c; --hero-4:#431407; --violet:#a78bfa; --violet-soft:#2a1f4a; --rest-1:#6d28d9; --rest-2:#2e1065; --amber:#fbbf24; --amber-soft:#3a2a0a; --blue:#38bdf8; --blue-soft:#0c2a3a; --sch-1:#1d4ed8; --sch-2:#172554; --teal-1:#0f766e; --teal-2:#042f2e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.6);
  --glass:rgba(22,26,34,.78); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:0 150px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 12px;margin-inline:-18px;padding-inline:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;color:var(--fg)}
.brand i{width:22px;height:22px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:inline-block;box-shadow:0 4px 10px -3px var(--accent)}
.sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;padding-left:31px}
.iconbtn{border:0;background:var(--surface);color:var(--fg);border-radius:14px;height:42px;width:42px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance;line-height:1.1}
h3{font-size:13px;color:var(--muted);margin:0;font-weight:700;letter-spacing:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.hot{box-shadow:var(--shadow),inset 0 0 0 2px var(--accent)}
.hero{background:linear-gradient(145deg,var(--hero-1),var(--hero-2));color:var(--hero-fg);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px var(--hero-1)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero h3{color:rgba(255,255,255,.75)}
.hero .big{color:#fff}
.hero .btn{background:#fff;color:var(--hero-2)}
.hero .dots span{background:rgba(255,255,255,.16);color:rgba(255,255,255,.8)}
.hero .dots span.on{background:#fff;color:var(--hero-2)}
.hero .dots span.today{outline-color:#fff}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.035em;line-height:1}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--sunk);color:var(--fg);min-height:46px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);box-shadow:0 8px 18px -8px var(--accent)}
.btn.water{background:var(--water-soft);color:var(--water)}
.btn.ghost{background:var(--sunk)}
.li .btn.ghost{background:var(--surface)}
.btn.sm{min-height:34px;padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,nav button:focus-visible,.check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grow{flex:1 1 0;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1.5px solid transparent;border-radius:14px;padding:11px 13px;width:100%;min-height:46px;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.bar.w>span{background:var(--water)}
.bar.g>span{background:var(--good)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted)}
.pill.due{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.chip:active{transform:scale(.96)}
.card .chip{background:var(--sunk);box-shadow:none}
.chip small{color:var(--muted);font-family:var(--f-data);font-size:11px;margin-left:5px}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:10px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;transition:all .15s}
.check.on{background:var(--good);border-color:var(--good)}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dots span{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.dots span.on{background:var(--accent);color:var(--on-accent)}
.dots span.today{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:9px;font-weight:700;cursor:pointer;transition:all .15s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ring svg{width:100%;max-width:96px;height:auto}
.ring .trk{fill:none;stroke:var(--sunk);stroke-width:9}
.ring .val{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
.ring .val.k{stroke:var(--accent)} .ring .val.p{stroke:var(--good)} .ring .val.w{stroke:var(--water)}
.ring .rv{font-family:var(--f-display);font-weight:800;font-size:19px;fill:var(--fg)}
.ring .ru{font-size:9.5px;fill:var(--muted);font-family:var(--f-body);font-weight:600}
.ring b{font-size:13px}
.ring span{font-size:11.5px;color:var(--muted)}
.ex{gap:10px}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-h b{font-size:17px;font-family:var(--f-display);letter-spacing:-.01em}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center}
.setrow input{min-height:42px;padding:8px;text-align:center;font-family:var(--f-data)}
.setrow .n{font-family:var(--f-data);color:var(--muted);text-align:center;font-size:13px}
.hint{font-size:13px;border-radius:12px;padding:8px 12px;background:var(--sunk);color:var(--muted)}
.hint.up{background:var(--accent-soft);color:var(--accent);font-weight:600}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:4;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}
.timer .num{font-size:22px}
.timer button{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700}
.warn{background:var(--accent-soft);color:var(--fg);border-radius:var(--r);padding:16px 18px;font-size:14px}
.warn b{color:var(--accent)}
.warn ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;padding-inline:8px;pointer-events:none}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:30px;padding:7px;box-shadow:0 12px 36px -12px rgba(0,0,0,.35),inset 0 0 0 1px var(--line);pointer-events:auto}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:11px 0 10px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;letter-spacing:-.1px;min-width:0;white-space:nowrap;overflow:hidden;font-weight:700;cursor:pointer;transition:all .18s}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.err{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-data);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent-soft);stroke:none}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.chart .bw{fill:var(--water)}
.chart .bg{fill:var(--accent)}
.chart .goal{stroke:var(--fg);stroke-dasharray:3 4;stroke-width:1;opacity:.4}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.status.cloud i{background:var(--good)}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.hd{display:flex;align-items:center;gap:11px;min-width:0}
.hd .ttl{font-weight:700;font-size:15.5px;letter-spacing:-.01em;flex:1;min-width:0}
.hd-r{flex:none}
.badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.badge svg{width:18px;height:18px}
.b-red{background:var(--accent-soft);color:var(--accent)}
.b-green{background:var(--good-soft);color:var(--good)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.b-light{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);width:28px;height:28px;border-radius:9px}
.b-light svg{width:15px;height:15px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;background:var(--surface);color:var(--muted);white-space:nowrap}
.card>.tag,.hd .tag{background:var(--sunk)}
.ex-h .tag{background:var(--sunk)}
.daynav{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
.daynav .x{width:40px;height:40px;font-size:22px;border-radius:12px;background:var(--sunk)}.daynav .x:disabled{opacity:.35}
.dn-l{position:relative;text-align:center;cursor:pointer;padding:8px 0}.dn-l b{font-size:15px}
.dn-l input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fw-nav{display:flex;align-items:center;gap:8px}.fw-nav .x{width:36px;height:36px;font-size:20px;border-radius:12px;background:var(--sunk)}.fw-nav .x:disabled{opacity:.35}
.fw-avg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fw-avg>div{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fw-avg b{font-size:20px}.fw-avg small{font-size:12px;color:var(--muted);font-weight:600}.fw-avg .tr{font-size:11px}
.fw-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.fwb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.fwb small{font-size:10.5px;min-height:13px;color:var(--fg)}
.fwb i{position:relative;display:block;width:100%;height:84px;border-radius:10px;background:var(--sunk);overflow:hidden}
.fwb i span{position:absolute;left:0;right:0;bottom:0;background:var(--hero-3);border-radius:8px 8px 0 0;opacity:.75}
.fwb i span.ok{background:var(--good);opacity:.85}
.fwb i em{position:absolute;left:0;right:0;border-top:2px dashed color-mix(in srgb,var(--fg) 35%,transparent)}
.fwb.on i{box-shadow:0 0 0 2px var(--accent)}.fwb.on>span{color:var(--accent)}.fwb.fut{opacity:.35;cursor:default}
.fw-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px 8px;align-items:center}
.fw-grid input{padding:9px 10px}
.hero.alt{background:linear-gradient(145deg,var(--hero-3),var(--hero-4));box-shadow:0 18px 40px -18px var(--hero-3)}
.bar.light{background:rgba(255,255,255,.22)}
.bar.light>span{background:#fff}
.minis{display:flex;flex-direction:column;gap:10px;min-width:0;width:48%}
.minis>div{display:flex;flex-direction:column;gap:4px}
.minis span{font-size:12px;opacity:.8}
.minis b{font-size:14px}
.planpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pp{border:0;background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;box-shadow:var(--shadow);color:var(--fg);text-align:left;transition:all .18s}
.pp-l{width:40px;height:40px;border-radius:13px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;margin-bottom:8px;color:var(--muted)}
.pp-t{font-weight:700}
.pp-s{font-size:12.5px;color:var(--muted)}
.pp.on{box-shadow:var(--shadow),inset 0 0 0 2px var(--accent)}
.pp.on .pp-l{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.exlist{display:flex;flex-direction:column;gap:2px}
.exi{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.exi-t{display:flex;align-items:center;gap:12px}
.exg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;margin-left:40px;padding:6px;border-radius:14px;background:var(--sunk)}
.exg img{width:112px;height:75px;object-fit:cover;border-radius:10px;flex:0 0 auto;background:#ddd}
.exg span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.exg.sm{margin-left:0}
.exg.big{flex-direction:column;align-items:stretch}.exg.big img{width:100%;height:auto;aspect-ratio:3/2}
.exi:last-child{border-bottom:0}
.exi .tag{background:var(--sunk)}
.idx{width:28px;height:28px;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none;font-family:var(--f-data)}
.idx.on{background:var(--good);color:#fff}
.ex-h{align-items:center!important;gap:12px!important}
.ex-h b{display:block}
.exdone{opacity:.75}
.hint{display:flex;gap:8px;align-items:flex-start}
.hint svg{width:16px;height:16px;flex:none;margin-top:1px}
.setrow.head{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.setrow.head span:first-child{text-align:center}
.setrow.done input{background:var(--good-soft);color:var(--good);font-weight:700}
.setrow.done .n{color:var(--good);font-weight:800}
.link{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13.5px;padding:6px 4px;cursor:pointer}
.link.muted{color:var(--muted)}
.soft-red{background:var(--accent-soft);box-shadow:none}
.soft-red .badge{background:var(--surface)}
.checks{display:flex;flex-direction:column;gap:10px}
.checks>div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.hist{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--sunk)}
.dt{width:46px;height:50px;border-radius:13px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.05}
.dt b{font-family:var(--f-display);font-size:19px}
.dt span{font-size:11px;color:var(--muted);font-weight:700}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.ai{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--violet-soft)}
.card.ai .btn.primary{background:linear-gradient(135deg,var(--violet),var(--accent));box-shadow:0 8px 18px -8px var(--violet)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);min-width:0}
.tile .badge{width:30px;height:30px;border-radius:10px;margin-bottom:6px}
.tile .badge svg{width:16px;height:16px}
.tl{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tile b small{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.coach-head{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--violet),var(--accent));color:#fff;display:grid;place-items:center;flex:none;font-weight:800;font-family:var(--f-display);font-size:17px;box-shadow:0 8px 20px -8px var(--violet)}
.avatar svg{width:22px;height:22px}
.avatar.lg{width:58px;height:58px;border-radius:20px;font-size:21px}
.avatar.lg svg{width:28px;height:28px}
.scroller{display:flex;gap:8px;overflow-x:auto;margin-inline:-18px;padding:4px 18px 8px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{white-space:nowrap;flex:none}
.empty-coach{align-items:center;text-align:center;padding:28px 20px}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:999px;padding:6px 6px 6px 8px;box-shadow:0 10px 30px -12px rgba(0,0,0,.3),inset 0 0 0 1px var(--line);z-index:3}
.composer input{background:transparent;min-height:42px;border:0}
.composer input:focus{background:transparent}
.send{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.send svg{width:20px;height:20px}
.send:disabled{opacity:.5}
.prof-head{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.prof-head b{font-size:17px}
.sub-form{padding-top:12px;border-top:1px dashed var(--line)}
.photo-pick{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:18px;background:var(--sunk);cursor:pointer;border:1.5px dashed var(--line);min-width:0}
.pick.main{background:var(--violet-soft);border-color:color-mix(in srgb,var(--violet) 35%,transparent)}
.pick .badge{margin-bottom:6px;background:var(--surface)}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photo-prev{position:relative;border-radius:18px;overflow:hidden;background:var(--sunk)}
.photo-prev img{display:block;width:100%;max-height:320px;object-fit:cover}
.ph-x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:34px;height:34px}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-radius:16px;background:var(--sunk);position:relative}
.pv .pv-n{grid-column:1/-1;background:var(--surface);font-weight:600;padding-right:44px}
.pv .x{position:absolute;right:14px;top:16px}
.pv input{min-height:40px;padding:8px 10px;font-size:14px;background:var(--surface)}
.u{position:relative;min-width:0}
.u input{padding-right:70px}
.u span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);pointer-events:none;font-weight:600}
.list:has(.pv){gap:8px}
.scroller.in-card{margin-inline:-18px;padding-inline:18px}
.chip.on{background:var(--fg)!important;color:var(--bg)}
.ftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.ft{position:relative;border-radius:18px;background:var(--sunk);transition:transform .12s,box-shadow .15s;min-width:0}
.ft:active{transform:scale(.97)}
.ft.has{background:var(--surface);box-shadow:inset 0 0 0 2px var(--good)}
.ft-main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:13px 13px 12px;width:100%;height:100%;border-radius:18px}
.ft-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ft-n{font-weight:700;font-size:14.5px;padding-right:30px;line-height:1.25}
.ft-por{font-size:12px;color:var(--muted)}
.ft-k{margin-top:6px;font-size:12px;color:var(--muted);font-weight:600}
.ft-k b{font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--fg);letter-spacing:-.03em;margin-right:2px}
.ft-bar{height:5px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden;margin-top:2px}
.ft-bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.ft-meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.ft-tag{align-self:flex-start;margin-top:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.ft-tag.g{background:var(--good-soft);color:var(--good)}
.ft-tag.a{background:var(--amber-soft);color:var(--amber)}
.ft-tag.n{background:var(--blue-soft);color:var(--blue)}
.ft-plus{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;color:var(--muted);pointer-events:none}
.ft-cnt{position:absolute;top:10px;right:10px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--good);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;pointer-events:none}
.ft.has .ft-n{padding-right:68px}
.ft-minus{position:absolute;top:10px;right:42px;width:26px;height:26px;border-radius:50%;border:0;background:var(--sunk);color:var(--fg);font-size:18px;font-weight:800;cursor:pointer;display:grid;place-items:center}
.chart .gl{fill:var(--muted);font-size:9.5px}
.chart .vl{fill:var(--fg);font-family:var(--f-display);font-weight:800;font-size:12px}
.chart-empty{padding:28px 0;text-align:center}
.hero.pj{background:linear-gradient(150deg,var(--teal-1),var(--teal-2));box-shadow:0 18px 40px -18px var(--teal-1)}
.pj .btn{background:#fff;color:var(--teal-2)}
.pj-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pj .big{font-size:44px}
.pj-u{font-size:18px;opacity:.75;margin-left:4px;font-weight:700}
.pj-sub{opacity:.85;font-size:14px;margin-top:6px}
.pj-goal{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12px}
.pj-goal span{opacity:.75}
.pj-goal b{font-size:18px}
.pj-track{display:flex;flex-direction:column;gap:6px}
.pj-track .bar{height:10px}
.pj-ends{display:flex;justify-content:space-between;font-size:12px;opacity:.85}
.bmi{position:relative;padding:6px 0}
.bmi-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px}
.bmi-bar span{display:block;height:100%}
.bmi-bar .z1{flex:2.5;background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.bmi-bar .z2{flex:6.5;background:var(--good-soft);box-shadow:inset 0 0 0 1px var(--good)}
.bmi-bar .z3{flex:5;background:var(--amber-soft);box-shadow:inset 0 0 0 1px var(--amber)}
.bmi i{position:absolute;top:0;width:6px;height:24px;border-radius:4px;background:var(--fg);transform:translateX(-50%);box-shadow:0 0 0 3px var(--surface)}
.bmi-lbl{position:relative;height:14px;font-size:11px;color:var(--muted)}
.bmi-lbl span{position:absolute;transform:translateX(-50%)}
.bmi-lbl span:first-child{left:0;transform:none}.bmi-lbl span:last-child{right:0;transform:none}
.seg.mini{align-self:flex-start}
.seg.mini button{padding:6px 14px;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cmp b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.cmp b small{font-size:12px;color:var(--muted);margin-left:2px}
.cmp .bar{height:5px;margin-top:4px;background:color-mix(in srgb,var(--muted) 18%,transparent)}
.cmp.three{grid-template-columns:repeat(3,1fr)}
.cmp.three>div{text-align:center;align-items:center}
.cmp.three .tl{font-size:11.5px}
.tr{font-size:11.5px;font-weight:700;font-family:var(--f-data)}
.tr.g{color:var(--good)}.tr.b{color:var(--bad)}.tr.n{color:var(--muted)}
.hm-wrap{display:flex;gap:6px}
.hm-days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:9.5px;color:var(--muted);align-items:center}
.hm{flex:1;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.hm i,.hm-leg i{display:block;aspect-ratio:1;border-radius:4px;background:var(--sunk)}
.hm-w{background:var(--accent)!important}
.hm-h{background:var(--water)!important;opacity:.55}
.hm-l{background:color-mix(in srgb,var(--muted) 30%,transparent)!important}
.hm-f{opacity:.35}
.hm-t{box-shadow:0 0 0 2px var(--fg)}
.hm-leg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hm-leg span{display:flex;align-items:center;gap:6px}
.hm-leg i{width:12px}
.pr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--sunk)}
.pr-i{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:var(--muted)}
.pr-i.top{background:linear-gradient(135deg,var(--amber),var(--accent-2));color:#fff}
.pr-r{display:flex;flex-direction:column;align-items:flex-end;flex:none;line-height:1.15}
.pr-r b{font-family:var(--f-display);font-size:18px}
.exgrid{display:flex;flex-wrap:wrap;gap:8px}
.exb{border:0;background:var(--sunk);color:var(--fg);border-radius:14px;padding:9px 12px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.exb small{font-size:11px;color:var(--good);font-weight:700}
.exb.on{background:var(--fg);color:var(--bg)}
.exb.on small{color:var(--good)}
.exb.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.lrow{display:grid;grid-template-columns:74px 1fr 1fr 54px 30px;gap:6px;align-items:center}
.lrow input{min-height:40px;padding:8px 6px;text-align:center;font-family:var(--f-data);font-size:14px}
.lrow.head{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.lrow .wk{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.lrow .wk small{font-size:10px;color:var(--muted);text-align:center}
.big-seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;font-size:15px}
.big-seg button svg{width:18px;height:18px}
.big-seg button.on:first-child{color:var(--accent)}
.big-seg button.on:last-child{color:var(--violet)}
.hero.rest-hero{background:linear-gradient(145deg,var(--rest-1),var(--rest-2));box-shadow:0 18px 40px -18px var(--rest-1)}
.hero .hero-ghost{background:rgba(255,255,255,.16);color:#fff}
.hero .row .btn{white-space:nowrap;padding-inline:14px}
.rest-hero .btn:not(.hero-ghost){color:var(--rest-2)}
.dots span.plan{box-shadow:inset 0 0 0 1.5px var(--accent);background:transparent}
.dots span.rest{opacity:.55}
.hero .dots span.plan{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75);background:transparent;color:#fff}
.hero .dots span.rest{background:rgba(255,255,255,.08)}
.wkplan{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wkd{border:0;border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px;font-weight:700;min-width:0}
.wkd i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.wkd i svg{width:15px;height:15px}
.wkd small{font-size:9.5px;font-weight:700;opacity:.85}
.wkd.t{background:var(--accent-soft);color:var(--accent)}
.wkd.t i{background:var(--accent);color:#fff}
.wkd.r{background:var(--violet-soft);color:var(--violet)}
.wkd.r i{background:var(--surface);color:var(--violet)}
.wkd.today{box-shadow:0 0 0 2px var(--fg)}
.check.auto{cursor:default}
.goals{gap:14px}
.g-eyebrow{font-size:12.5px;color:var(--muted);font-weight:700}
.g-title{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.2;margin-top:2px;text-wrap:balance}
.g-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.g-head .btn{flex:none;white-space:nowrap}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.g-body{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.gr{position:relative;width:118px;max-width:100%;aspect-ratio:1}
.gr svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.gr-trk{fill:none;stroke-width:10;opacity:.16}
.gr-val{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.gr-trk.k,.gr-val.k{stroke:var(--accent)}.gr-trk.p,.gr-val.p{stroke:var(--good)}.gr-trk.w,.gr-val.w{stroke:var(--water)}
.gr-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gr-c b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.03em}
.gr-c span{font-size:11px;color:var(--muted);font-weight:700;margin-left:1px}
.g-rows{display:flex;flex-direction:column;gap:10px;min-width:0}
.g-row{display:flex;align-items:center;gap:10px;min-width:0}
.g-row i{width:4px;align-self:stretch;border-radius:4px;flex:none}
.g-row.k i{background:var(--accent)}.g-row.p i{background:var(--good)}.g-row.w i{background:var(--water)}
.g-l{font-size:12px;color:var(--muted);font-weight:700}
.g-v{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-v span{color:var(--muted);font-weight:500;font-size:12px}
.g-left{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;flex:none}
.g-left.done{color:var(--good)}
.g-water{display:flex;align-items:center;gap:8px;background:var(--water-soft);border-radius:18px;padding:8px}
.g-wl{font-size:12.5px;font-weight:700;color:var(--water);padding-left:6px;flex:1;min-width:0;white-space:nowrap}
.wbtn:not(.undo){flex:1;justify-content:center}
.wbtn{border:0;background:var(--surface);color:var(--water);border-radius:13px;min-height:46px;padding:6px 12px;display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:700;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .12s}
.wbtn:active{transform:scale(.95)}
.wbtn svg{width:20px;height:20px;flex:none}
.wbtn span{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.wbtn small{font-size:10.5px;color:var(--muted);font-weight:600}
.wbtn.undo{padding:6px 11px;color:var(--muted)}
.wbtn:disabled{opacity:.4;cursor:default}
@media (max-width:360px){.g-body{grid-template-columns:1fr;justify-items:center}.g-rows{width:100%}.g-wl{display:none}}
.g-leg{display:flex;gap:16px;font-size:12.5px;font-weight:700;color:var(--muted)}
.g-leg span{display:flex;align-items:center;gap:6px}
.g-leg i{width:10px;height:10px;border-radius:50%}
.g-leg .k i{background:var(--accent)}.g-leg .p i{background:var(--good)}.g-leg .w i{background:var(--water)}
.wg-box{background:var(--water-soft);border-radius:18px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.wg-top{display:flex;justify-content:space-between;align-items:center}
.wg-t{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--water);font-size:14px}
.wg-t svg{width:16px;height:16px}
.wg-c{font-size:12.5px;color:var(--muted);font-weight:600}
.wg-c b{color:var(--water);font-size:15px}
.wg-row{display:grid;gap:4px}
.wg{border:0;background:transparent;padding:2px 0;cursor:pointer;border-radius:8px;display:grid;place-items:center;transition:transform .15s}
.wg:active{transform:scale(.88)}
.wg:focus-visible{outline:2px solid var(--water);outline-offset:1px}
.wg svg{width:100%;max-width:26px;height:auto;display:block}
.wg-o{fill:none;stroke:color-mix(in srgb,var(--water) 45%,transparent);stroke-width:1.6;stroke-linejoin:round}
.wg.on .wg-o{stroke:var(--water)}
.wg-fill{fill:var(--water);transition:y .35s ease,height .35s ease}
.wg-hint{font-size:11px;color:var(--muted);text-align:center}
.lq-box{background:var(--water-soft);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lq-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.lq-t{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--water)}
.lq-t svg{width:14px;height:14px}
.lq-big{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--fg);margin-top:2px}
.lq-r{display:flex;align-items:center;gap:10px}
.lq-left{font-size:12.5px;font-weight:700;color:var(--muted)}
.lq-left.done{color:var(--good)}
.lq-plus{width:42px;height:42px;border-radius:50%;border:0;background:var(--water);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px -8px var(--water);transition:transform .12s}

.cb-card{position:relative;background:var(--surface);border-radius:26px;padding:22px 18px 18px;width:100%;max-width:400px;max-height:85dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);animation:cbpop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes cbpop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.cb-eyebrow{font-size:12.5px;font-weight:700;color:var(--muted)}
.cb-title{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.cb-stars{display:flex;justify-content:center;gap:6px;font-size:30px;color:var(--line)}
.cb-stars .on{color:#fbbf24}
.cb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb-grid>div{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.cb-grid b{font-family:var(--f-display);font-size:22px}
.cb-grid b small{font-size:12px;color:var(--muted)}
.cb-grid span{font-size:12px;color:var(--muted)}
.cb-badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.bh-lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:-4px}
.bh-next{display:flex;flex-direction:column;gap:8px}
.bn{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:14px;padding:10px 12px}
.bn .bdg-i{width:38px;height:38px;margin:0;flex:none;opacity:.7}
.bn .bdg-i svg{width:19px;height:19px}
.bn b{font-size:14px}
.bn .bdg-p{width:100%;margin-top:6px}
.bh-got{display:grid;grid-auto-flow:column;grid-auto-columns:74px;gap:8px;overflow-x:auto;margin-inline:-18px;padding:2px 18px 4px;scrollbar-width:none}
.bh-got::-webkit-scrollbar{display:none}
.bm{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.bm .bdg-i{margin:0}
.bm small{font-size:10.5px;font-weight:600;line-height:1.2}
.bm.on .bdg-i{opacity:1;color:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}
.bm.on.red .bdg-i{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.bm.on.amber .bdg-i{background:linear-gradient(135deg,#fbbf24,#f97316)}
.bm.on.blue .bdg-i{background:linear-gradient(135deg,#38bdf8,#2563eb)}
.bm.on.green .bdg-i{background:linear-gradient(135deg,#34d399,#059669)}
.bm.on.violet .bdg-i{background:linear-gradient(135deg,#a78bfa,#6d28d9)}
.hist{flex-wrap:wrap}
.h-act{display:flex;gap:2px;flex:none}
.h-act .x svg{width:16px;height:16px}
.del-conf{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:14px;padding:8px 10px;font-size:13.5px;font-weight:600;margin-top:-2px}
#view>*{animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

    for(let i=0;i<400;i++){const v=dayRO(d);if(v&&v.meds&&v.meds[m.id]){st++;d=addDays(d,-1)}else break}o.streak=st;
    let tk=0;if(o.start){const lim=Math.min(o.dayNo||0,400);for(let i=0;i<lim;i++){const v=dayRO(addDays(td,-i));if(v&&v.meds&&v.meds[m.id])tk++}o.takenCount=tk}}

  catch(e){url=URL.createObjectURL(file);src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("Bu dosya bir fotoğraf olarak açılamadı."));im.src=url});w=src.naturalWidth;h=src.naturalHeight}

  if(!key) throw new Error("Gemini API anahtarı girilmedi. Ayarlar → Yapay zekâ bölümünden ekle.");
  const model0=(S.profile.geminiModel||GEMINI_MODELS[0]).trim();
  const b64s=images?await Promise.all(images.map(blobToB64)):[];
  const cont=turns.map((t,i)=>({role:t.r==="u"?"user":"model",parts:(i===turns.length-1&&b64s.length?b64s.map(d=>({inlineData:{mimeType:"image/jpeg",data:d}})):[]).concat([{text:t.t}])}));
  const call=async (model,viaQuery)=>{let res;
    try{res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent"+(viaQuery?"?key="+encodeURIComponent(key):""),{
      method:"POST",headers:viaQuery?{"Content-Type":"application/json"}:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({systemInstruction:{parts:[{text:ctx}]},contents:cont,
        generationConfig:json?{responseMimeType:"application/json",temperature:.2}:{temperature:.7}})});
    }catch(e){throw new Error(inViewer()?"Bu sayfa güvenlik gereği Gemini'ye bağlanamıyor. Ayarlar'dan Claude'u seç ya da Gemini için bağımsız sürümü kullan.":"Gemini'ye bağlanılamadı. İnternet bağlantını kontrol et.")}
    return {res,data:await res.json().catch(()=>({}))}};
  let {res,data}=await call(model0);let model=model0;
  if(res.status===401){const r0=await call(model0,true);res=r0.res;data=r0.data}
  const busy=r=>r.status===503||r.status===500||/high demand|overloaded|UNAVAILABLE/i.test((data.error&&(data.error.message+" "+data.error.status))||"");
  if(!res.ok&&busy(res)){await new Promise(r=>setTimeout(r,1500));const r1=await call(model0);res=r1.res;data=r1.data}
  const modelIssue=r=>busy(r)||r.status===404||(r.status===403&&!/API key/i.test((data.error&&data.error.message)||""))||(r.status===429&&/limit: 0|free/i.test((data.error&&data.error.message)||""));
  if(!res.ok&&modelIssue(res)){const alt=GEMINI_MODELS.find(m=>m!==model0);if(alt){const r2=await call(alt);if(r2.res.ok){res=r2.res;data=r2.data;model=alt;S.profile.geminiModel=alt;mark("profile")}}}
  if(!res.ok){const m=data&&data.error&&data.error.message||("HTTP "+res.status);
    throw new Error(res.status===401||(res.status===400&&/API key/i.test(m))?"API anahtarı geçersiz ya da silinmiş. aistudio.google.com/apikey adresinden anahtarını yeniden kopyala (gerekirse yenisini oluştur) ve Ayarlar'a yapıştır.":res.status===404?"Model bulunamadı ("+model+"). Ayarlar'da listeden başka bir model seç.":busy(res)?"Gemini şu an çok yoğun. Birkaç dakika sonra tekrar dene.":res.status===429?"Gemini kotası doldu, biraz sonra tekrar dene.":res.status===403?"Bu anahtarın bu modele erişimi yok ("+model+"). Listeden başka model seç.":"Gemini hatası: "+m)}
  const text=((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  if(!text) throw new Error("Gemini boş yanıt döndü.");
  if(json){try{return JSON.parse(text.replace(/^```(json)?|```$/g,"").trim())}catch(e){throw new Error("Yanıt okunamadı, tekrar dene.")}}
  return text;
}

function niceTicks(min,max,n=3){if(min===max){min-=1;max+=1}const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0);
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(4));return t}
let lcId=0;
function smoothPath(xy){if(xy.length<3)return xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  let d="M"+xy[0][0].toFixed(1)+" "+xy[0][1].toFixed(1);
  for(let i=0;i<xy.length-1;i++){const p0=xy[i-1]||xy[i],p1=xy[i],p2=xy[i+1],p3=xy[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=" C"+c1.map(v=>v.toFixed(1)).join(" ")+" "+c2.map(v=>v.toFixed(1)).join(" ")+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1)}
  return d}
function lineChart(pts,{unit="",goal=null,tone="accent"}={}){
  if(pts.length<2) return '<div class="empty chart-empty">Grafik için en az 2 kayıt gerekiyor.</div>';
  const W=340,H=180,L=34,R=14,T=22,B=24,id="lg"+(++lcId);
  const ys=pts.map(p=>p.y).concat(goal!=null?[goal]:[]);let mn=Math.min(...ys),mx=Math.max(...ys);const pd=(mx-mn)*.18||1;
  const ticks=niceTicks(mn-pd,mx+pd);const y0=ticks[0],y1=ticks[ticks.length-1];
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const xy=pts.map((p,i)=>[X(i),Y(p.y)]);const path=smoothPath(xy);
  const area=path+" L"+X(pts.length-1).toFixed(1)+" "+(H-B)+" L"+L+" "+(H-B)+" Z";
  const last=pts[pts.length-1];const col=tone==="good"?"var(--good)":"var(--accent)";
  const hiI=pts.reduce((b,p,i)=>p.y>pts[b].y?i:b,0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik, son değer ${last.y}${unit}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${t}</text>`).join("")}
    ${goal!=null?`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}"/><text x="${W-R}" y="${Y(goal)-5}" text-anchor="end" class="gl">hedef ${goal}${unit}</text>`:""}
    <path d="${area}" fill="url(#${id})" stroke="none"/><path class="ln" d="${path}" style="stroke:${col}"/>
    ${hiI!==pts.length-1?`<circle cx="${X(hiI)}" cy="${Y(pts[hiI].y)}" r="3" fill="${col}"/>`:""}
    <circle cx="${X(pts.length-1)}" cy="${Y(last.y)}" r="9" fill="${col}" opacity=".18"/><circle class="dot" cx="${X(pts.length-1)}" cy="${Y(last.y)}" r="4.5" style="fill:${col}"/>
    <text x="${Math.min(X(pts.length-1),W-R)}" y="${Y(last.y)-12}" text-anchor="end" class="vl">${last.y}${unit}</text>
    <text x="${L}" y="${H-6}">${esc(pts[0].x)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${esc(last.x)}</text>
  </svg>`;
}
function barChart(pts,{cls="bw",goal=null}={}){
  const W=340,H=150,L=34,R=8,T=10,B=22;const mx=Math.max(1,...pts.map(p=>p.y),goal||0);const ticks=niceTicks(0,mx,3);const y1=ticks[ticks.length-1];
  const bw=(W-L-R)/pts.length;const Y=v=>T+(H-T-B)*(1-v/y1);

    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-5}" y="${Y(t)+3}" text-anchor="end">${t>=1000?(t/1000)+"k":t}</text>`).join("")}

    ${pts.map((p,i)=>{const st=Math.ceil(pts.length/7);return ((i%st===0&&pts.length-1-i>=st)||i===pts.length-1)}).map((ok,i)=>ok?`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(pts[i].x)}</text>`:"").join("")}

function weekStart(d){return addDays(d,-wd(d))}
function weekStats(from){const t=targets(),p=S.profile;let wo=0,water=0,prot=0,kcal=0,logged=0,gainer=0;
  for(let i=0;i<7;i++){const d=addDays(from,i),v=dayRO(d);if(!v)continue;wo+=(v.workouts||[]).length;if((v.water||0)>=p.waterGoal)water++;
    const fs=v.foods||[];if(fs.length){logged++;const k=fs.reduce((a,f)=>a+(+f.kcal||0),0),pr=fs.reduce((a,f)=>a+(+f.p||0),0);if(k>=t.kcal*.95)kcal++;if(pr>=t.protein)prot++}
    if(fs.some(f=>f.gid==="am")&&fs.some(f=>f.gid==="pm"))gainer++}
  const ws=p.weights.filter(x=>x.d>=from&&x.d<addDays(from,7));const dw=ws.length>=2?r1(ws[ws.length-1].kg-ws[0].kg):null;
  return {wo,water,prot,kcal,logged,gainer,dw}}

  for(let d=days[0];d<=today();d=addDays(d,1)){if(test(dayRO(d)||{}))best=Math.max(best,++cur);else if(d!==today())cur=0}return best}

let progEx=null, progRange="all", badgeAll=false;
function dayStats(d){const v=dayRO(d);if(!v)return null;const k=(v.foods||[]).reduce((a,f)=>a+(+f.kcal||0),0),p=(v.foods||[]).reduce((a,f)=>a+(+f.p||0),0);
  return {k,p,w:v.water||0,wo:(v.workouts||[]).length,logged:(v.foods||[]).length>0}}
function periodStats(from,to){let wo=0,kS=0,pS=0,kN=0,wS=0,n=0;
  for(let d=from;d<=to;d=addDays(d,1)){n++;const s=dayStats(d);if(!s)continue;wo+=s.wo;wS+=s.w;if(s.logged){kS+=s.k;pS+=s.p;kN++}}
  return {wo,k:kN?Math.round(kS/kN):null,p:kN?Math.round(pS/kN):null,w:n?Math.round(wS/n):0}}
function trend(cur,prev,unit,good="up",fmt=v=>v){
  if(cur==null)return `<b class="num">—</b><span class="tr n">kayıt yok</span>`;
  if(prev==null||prev===0&&cur===0)return `<b class="num">${fmt(cur)}<small>${unit}</small></b><span class="tr n">geçen hafta yok</span>`;
  const d=cur-prev,up=d>0,flat=Math.abs(d)<(Math.abs(prev)*.03||.001);const ok=flat?"n":((up&&good==="up")||(!up&&good==="down"))?"g":"b";
  return `<b class="num">${fmt(cur)}<small>${unit}</small></b><span class="tr ${ok}">${flat?"≈ aynı":(up?"▲ ":"▼ ")+fmt(Math.abs(Math.round(d*10)/10))+unit}</span>`}

function backupData(){return {app:"guc-defteri",v:2,savedAt:new Date().toISOString(),profile:S.profile,months:S.months,lifts:S.lifts,school:S.school,chat:S.chat}}
function restoreFrom(o){if(!o||!o.profile||!o.months)throw new Error("bad");S.profile=Object.assign({},DEF_PROFILE,o.profile);S.profile.place="gym";S.months=o.months;
  if(o.lifts&&o.lifts.ex){S.lifts=o.lifts;mark("lifts")}if(o.school&&o.school.courses){S.school=migrateSchool(o.school);delete S.school._mig;mark("school")}if(o.chat&&Array.isArray(o.chat.msgs)){S.chat=o.chat;mark("chat")}
  mark("profile");Object.keys(S.months).forEach(mark);toast("Yedek yüklendi");render()}
let pendingRestore=null;
async function downloadBackup(){const name="ozbenapp-yedek-"+today()+".json";const txt=JSON.stringify(backupData());const blob=new Blob([txt],{type:"application/json"});
  const done=()=>{lsSet("gd:lastbackup",today());toast("Yedek dosyası indirildi");const l=$("#bk-last");if(l)l.textContent="Son yedek: bugün";if(tab==="today")render()};
  if(inViewer()){let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
    if(!dl){toast("Bu görünümde dosya indirilemiyor. Metin olarak kopyala seçeneğini kullan.");return}
    try{const r=await dl.save({filename:name,data:blob});if(r&&r.status==="saved")done()}catch(e){if(e&&e.code!=="cancelled"&&e.code!=="declined")toast("Yedek indirilemedi. Metin olarak kopyala seçeneğini kullan.")}return}
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);done()}
  catch(e){toast("Yedek indirilemedi. Metin olarak kopyala seçeneğini kullan.")}}
function renderStatus(){const el=$("#status");if(!el)return;el.className="status "+(cloud?"cloud":"");
  el.innerHTML=cloud?"<i></i>Veriler hesabında saklanıyor, bu sayfayı açtığın her cihazda aynı.":"<i></i>Veriler bu cihazın tarayıcısında saklanıyor. Düzenli yedek al."}

function render(){
  const _ks={};document.querySelectorAll("#view [data-ks]").forEach(e=>_ks[e.dataset.ks]=e.scrollLeft);
  $("#today-label").textContent=GUNLER[new Date().getDay()]+", "+fmtD(today());
  renderTabs();
  const v={today:vToday,work:vWork,food:vFood,prog:vProg,school:vSchool,coach:vCoach,settings:vSettings,lifts:vLifts,meds:vMeds}[tab]||vToday;
  $("#view").innerHTML=v();
  if(tab==="settings")renderStatus();
  if(tab==="work"&&active)tickTimer();

  document.querySelectorAll("#view [data-ks]").forEach(e=>{if(_ks[e.dataset.ks])e.scrollLeft=_ks[e.dataset.ks]});
  clearTimeout(render._bt);render._bt=setTimeout(checkBadgesAndSummaries,500);
}

async function sendChat(text){
  if(chatBusy)return;if(tab!=="coach")go("coach");
  S.chat.msgs.push({r:"u",t:text});chatBusy=true;chatErr="";render();
  try{const turns=S.chat.msgs.slice(-12);while(turns.length&&turns[0].r!=="u")turns.shift();
    const ans=await aiCall(turns);S.chat.msgs.push({r:"a",t:ans.trim()});
  }catch(e){chatErr=e.message;S.chat.msgs.pop();}
  if(S.chat.msgs.length>40)S.chat.msgs=S.chat.msgs.slice(-40);
  chatBusy=false;mark("chat");render();
  if(chatErr){const i=$("#in-chat");if(i)i.value=text}
}

/* su çubuğu: sürükle / dokun */
(function(){let drag=null;
  function valAt(el,x){const r=el.getBoundingClientRect(),g=+el.dataset.goal;const f=Math.max(0,Math.min(1,(x-r.left)/r.width));return Math.round(f*g/250)*250}
  function paint(el,ml){const g=+el.dataset.goal;const f=$("#lq-fill");if(f)f.style.width=Math.min(100,ml/g*100)+"%";const v=$("#lq-val");if(v)v.textContent=fmtL(ml);
    const l=$("#lq-left");if(l){const left=Math.max(0,g-ml);l.textContent=left?fmtL(left)+" kaldı":"✓ Hedef tamam";l.classList.toggle("done",!left)}
    el.setAttribute("aria-valuenow",ml);el.setAttribute("aria-valuetext",fmtL(ml))}
  function commit(ml){const d=today(),x=day(d);if(x.water!==ml){x.water=ml;touchDay(d)}render()}
  document.addEventListener("pointerdown",e=>{const el=e.target.closest("#lq");if(!el)return;e.preventDefault();drag={el,id:e.pointerId,ml:valAt(el,e.clientX)};
    try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add("drag");paint(el,drag.ml)});
  document.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;drag.ml=valAt(drag.el,e.clientX);paint(drag.el,drag.ml)});
  const end=e=>{if(!drag||e.pointerId!==drag.id)return;const ml=drag.ml;drag.el.classList.remove("drag");drag=null;commit(ml)};
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
  document.addEventListener("keydown",e=>{const el=e.target.closest&&e.target.closest("#lq");if(!el)return;const g=+el.dataset.goal;const cur=+el.getAttribute("aria-valuenow");
    let n=null;if(e.key==="ArrowRight"||e.key==="ArrowUp")n=cur+250;else if(e.key==="ArrowLeft"||e.key==="ArrowDown")n=Math.max(0,cur-250);else if(e.key==="Home")n=0;else if(e.key==="End")n=g;
    if(n!=null){e.preventDefault();commit(n);setTimeout(()=>{const x=$("#lq");if(x)x.focus()},0)}});
})();
